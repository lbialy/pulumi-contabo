name: release
on:
  push:
    tags:
      - v*.*.*
env:
  # THIS GITHUB_TOKEN IS A REQUIREMENT TO BE ABLE TO WRITE TO GH RELEASES
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # To publish to npm, set PUBLISH_NPM to true and add an NPM_TOKEN secret.
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  PUBLISH_NPM: false
  NPM_REGISTRY_URL: https://registry.npmjs.org
  # To publish to NuGet, set PUBLISH_NUGET to true and add a NUGET_PUBLISH_KEY secret.
  NUGET_PUBLISH_KEY: ${{ secrets.NUGET_PUBLISH_KEY }}
  NUGET_FEED_URL: https://api.nuget.org/v3/index.json
  PUBLISH_NUGET: false
  # To publish to PyPI, set PUBLISH_PYPI to true and add a PYPI_API_TOKEN secret.
  PYPI_USERNAME: __token__
  PYPI_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
  PYPI_REPOSITORY_URL: ""
  PUBLISH_PYPI: false
jobs:
  publish_binary:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: pulumi/pulumictl
      - name: Set PreRelease Version
        run: echo "GORELEASER_CURRENT_TAG=v$(pulumictl get version --language generic)" >> $GITHUB_ENV
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: -p 3 release --clean
          version: "~> v2"
  publish_sdk:
    name: Publish SDKs
    runs-on: ubuntu-latest
    needs: publish_binary
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: |
            provider/go.sum
            sdk/go.sum
      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: pulumi/pulumictl
      - name: Install Pulumi CLI
        uses: pulumi/actions@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.nodeversion }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
      - name: Setup DotNet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnetversion }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.pythonversion }}
      - name: Install Python build tooling
        if: ${{ matrix.language == 'python' }}
        run: python -m pip install --upgrade build
      - name: Build SDK
        run: make build_${{ matrix.language }}
      - if: ${{ matrix.language == 'python' && env.PUBLISH_PYPI == 'true' }}
        name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ env.PYPI_USERNAME }}
          password: ${{ env.PYPI_PASSWORD }}
          packages-dir: ${{ github.workspace }}/sdk/python/bin/dist
      - if: ${{ matrix.language == 'nodejs' && env.PUBLISH_NPM == 'true' }}
        uses: JS-DevTools/npm-publish@v4
        with:
          access: "public"
          token: ${{ env.NPM_TOKEN }}
          package: ${{ github.workspace }}/sdk/nodejs/bin/package.json
      - if: ${{ matrix.language == 'dotnet' && env.PUBLISH_NUGET == 'true' }}
        name: publish nuget package
        run: |
          dotnet nuget push ${{ github.workspace }}/sdk/dotnet/bin/Debug/*.nupkg -s ${{ env.NUGET_FEED_URL }} -k ${{ env.NUGET_PUBLISH_KEY }}
          echo "done publishing packages"
    strategy:
      fail-fast: true
      matrix:
        dotnetversion:
          - 8.0.x
        language:
          - nodejs
          - python
          - dotnet
          - go
        nodeversion:
          - 20.x
        pythonversion:
          - "3.12"
