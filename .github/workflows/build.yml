name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider:
    name: Build provider and check SDKs are up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: |
            provider/go.sum
            sdk/go.sum
      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: pulumi/pulumictl
      - name: Install Pulumi CLI
        uses: pulumi/actions@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Setup DotNet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build provider binary
        run: make provider
      - name: Regenerate SDKs
        run: make build_sdks
      # SDK sources are committed, so a drift here means someone changed resources.go
      # or bumped the upstream provider without re-running `make build_sdks`.
      - name: Check SDKs are up to date
        run: |
          git update-index -q --refresh
          if ! git diff --quiet -- sdk; then
            >&2 echo "error: generated SDKs are out of date; run 'make build_sdks' and commit the result"
            git --no-pager diff --stat -- sdk
            exit 1
          fi

  lint:
    name: Lint provider
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: provider
          args: -c ../.golangci.yml
