version: 2
project_name: pulumi-contabo
before:
  hooks:
    - make tfgen
builds:
  - binary: pulumi-resource-contabo
    dir: provider
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
      - windows
    ldflags:
      # The line below MUST align with the module in current provider/go.mod
      - -X github.com/lbialy/pulumi-contabo/provider/pkg/version.Version={{.Tag }}
    main: ./cmd/pulumi-resource-contabo/
archives:
  - id: archive
    # Pulumi's plugin resolver downloads exactly this name from GitHub releases when a
    # program declares the github:// PluginDownloadURL, so do not reformat it.
    name_template: '{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}'
    # tar.gz on every platform, including Windows: the resolver does not read zips.
    formats:
      - tar.gz
changelog:
  disable: true
release:
  disable: false
  prerelease: auto
snapshot:
  version_template: '{{ .Tag }}-SNAPSHOT'
