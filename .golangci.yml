version: "2"
run:
  timeout: 20m
linters:
  default: none
  # Carried over from the pre-v2 config. deadcode/structcheck/varcheck were folded
  # into unused, golint into revive, and megacheck into staticcheck; interfacer was
  # dropped upstream with no successor.
  enable:
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    revive:
      rules:
        # Pulumi provider boilerplate does not carry package comments.
        - name: package-comments
          disabled: true
formatters:
  enable:
    - gofmt
