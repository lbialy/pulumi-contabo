version: "2"
run:
  timeout: 20m
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    revive:
      rules:
        # Pulumi provider boilerplate does not carry package comments.
        - name: package-comments
          disabled: true
formatters:
  enable:
    - gofmt
